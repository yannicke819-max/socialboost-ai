n orient(o){st.orientation=o;st.step=6;save();render()}function header(){return '<div class="top"><div class="bar"><div class="brand">MAIA</div><nav>'+[['home','Accueil'],['projects','Projets'],['create','Créer'],['research','Recherche et analyse']].map(([r,l])=>'<button class="n '+(st.route===r?'on':'')+'" onclick="go(\''+r+'\')">'+l+'</button>').join('')+'</nav><button class="n sec" onclick="go(\'settings\')">Réglages et services</button></div><div class="truth"><b>● Maquette interactive</b> · données, activités, sources et résultats simulés · aucune recherche Web réelle</div></div>'}function pnav(){return '<div class="projectnav">'+[['project','Vue d’ensemble'],['mission','Mission'],['research','Recherche'],['realisation','Réalisation'],['results','Résultats'],['decisions','Décisions'],['journal','Journal']].map(([r,l])=>'<button class="'+(st.route===r?'on':'')+'" onclick="go(\''+r+'\')">'+l+'</button>').join('')+'</div>'}function progress(){return '<div class="steps">'+steps.map((x,i)=>{let n=i+1,c=n<st.step?'done':n===st.step?'active':'';return '<button class="step '+c+'" onclick="step('+n+')"><span class="ey">0'+n+'</span><b>'+x+'</b><small>'+(n<st.step?'Terminé':n===st.step?'En cours':'À venir')+'</small></button>'}).join('')+'</div>'}function hero(){return '<section class="hero"><div><div class="ey">Projet en cours</div><h1>Suivi des devis</h1><p>Éviter les relances oubliées, sans remplacer inutilement l’outil actuel.</p><section class="panel status"><div class="row"><div class="now">'+(st.step===2?'MAIA travaille maintenant · Recherche':steps[st.step-1])+'</div><div><b>Étape '+st.step+' sur 6</b><div class="muted">Progression indicative</div></div></div><div class="prog"><i style="width:'+(st.step/6*100)+'%"></i></div><p>'+(st.step===2?'Thomas rassemble les sources d’exemple. Linh prépare les options à partir des éléments disponibles.':st.step===3?'Linh structure les options comparables.':st.step===4?'Priya examine les options et cherche les faiblesses.':st ission(){return '<main>'+hero()+pnav()+'<div class="grid2"><section class="card"><div class="ey">Étapes</div><h2>La mission, étape par étape</h2><div class="timeline">'+steps.map((x,i)=>'<button class="item" onclick="step('+(i+1)+')"><b>'+ (i+1)+'. '+x+'</b><span>'+((i+1)<st.step?'Terminé':(i+1)===st.step?'En cours':'À venir')+'</span></button>').join('')+'</div></section><section class="card"><div class="ey">Équipe mobilisée</div><h2>Qui intervient et pourquoi ?</h2><div class="list"><div class="item"><b>Thomas</b><span>Recherche · actif maintenant</span></div><div class="item"><b>Linh</b><span>Analyse métier · prépare les options</span></div><div class="item"><b>Priya</b><span>Revue critique · ensuite</span></div><div class="item"><b>Lucas</b><span>Vérification · étape ultérieure</span></div></div><div class="btns"><button class="btn" onclick="go(\'journal\')">Ouvrir le Journal</button></div></section></div></main>'}function research(){let body=st.step===2?'<div class="card"><div class="ey">Question de départ</div><h2>Quelle solution de suivi conviendrait à une équipe de cinq personnes ?</h2><p>Recherche d’exemple en cours. Les éléments disponibles sont provisoires.</p><div class="btns"><button class="btn" onclick="openM(\'Sources d’exemple\',\'Démonstration\',\'<p>Sources et contenus simulés pour illustrer le parcours. Aucune recherche Web réelle n’a été exécutée.</p><div class=notice>Source A · comparatif simulé<br>Source B · fiche produit simulée<br>Source C · retour utilisateur simulé</div>\')">Voir les sources d’exemple</button><button class="btn primary" onclick="step(3)">Préparer les options</button></div></div>':st.step===3?'<div class="grid3">'+['Outil existant','Automatisation','Application'].map(x=>'<div class="card"><span class="tag">Provisoire</span><h3>'+x+'</h3><p>Option préparée par Linh à partir des éléments disponibles.</p></div>').join('')+'</div><div class="btns"><button class="btn primary" onclick="step(4)">Passer à la revue critique</button>< div class="ey">Décisions</div><h1>'+(st.step<5?'Aucune décision nécessaire pour le moment.':'Une orientation peut être retenue.')+'</h1><p>MAIA continue tant qu’aucune décision réelle n’est nécessaire.</p></main>'}function simple(title,txt){return '<main><div class="ey">Prototype autonome</div><h1>'+title+'</h1><div class="card"><p>'+txt+'</p><div class="btns"><button class="btn primary" onclick="go(\'home\')">Retour à l’Accueil</button></div></div></main>'}function bottom(){return '<div class="bottom">'+[['home','Accueil'],['projects','Projets'],['research','MAIA'],['decisions','À traiter']].map(([r,l])=>'<button class="'+(st.route===r?'on':'')+'" onclick="go(\''+r+'\')">'+l+'</button>').join('')+'</div>'}function render(){let c={home:home,project,mission,research,realisation,results,journal,decisions,projects:()=>simple('Projets','Le projet de démonstration “Suivi des devis” est le scénario unique de cette maquette.'),create:()=>simple('Créer','Création simulée : aucun projet réel n’est créé.'),settings:()=>simple('Réglages et services','Accès secondaire discret dans cette maquette.')};document.getElementById('app').innerHTML=header()+(c[st.route]||home)()+bottom()}function openM(t,e,b){document.getElementById('mt').textContent=t;document.getElementById('mey').textContent=e;document.getElementById('mb').innerHTML=b;document.getElementById('modal').classList.add('open')}function closeM(){document.getElementById('modal').classList.remove('open')}render();
